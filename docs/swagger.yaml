basePath: /
definitions:
  gin.H:
    additionalProperties: {}
    type: object
  go-gin-crud_internal_dto.AccountResponse:
    properties:
      balance:
        type: integer
    type: object
  go-gin-crud_internal_dto.BatchExecuteRequest:
    properties:
      tasks:
        items:
          $ref: '#/definitions/go-gin-crud_internal_dto.TaskRequest'
        type: array
      timeout:
        description: 整體超時時間（秒）
        minimum: 1
        type: integer
    required:
    - tasks
    - timeout
    type: object
  go-gin-crud_internal_dto.BatchExecuteResponse:
    properties:
      error_count:
        type: integer
      success_count:
        type: integer
      tasks:
        items:
          $ref: '#/definitions/go-gin-crud_internal_dto.TaskResponse'
        type: array
      timeout_count:
        type: integer
      total_duration:
        description: 總執行時間（毫秒）
        type: integer
      total_tasks:
        type: integer
    type: object
  go-gin-crud_internal_dto.BatchSubmitTaskRequest:
    properties:
      pool_id:
        description: 工作池 ID
        type: string
      tasks:
        description: 任務列表
        items:
          $ref: '#/definitions/go-gin-crud_internal_dto.SubmitTaskRequest'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - pool_id
    - tasks
    type: object
  go-gin-crud_internal_dto.BatchSubmitTaskResponse:
    properties:
      pool_id:
        type: string
      rejected:
        description: 被拒絕的任務數
        type: integer
      results:
        description: 每個任務的提交結果
        items:
          $ref: '#/definitions/go-gin-crud_internal_dto.SubmitTaskResponse'
        type: array
      submitted:
        description: 成功提交的任務數
        type: integer
      submitted_at:
        type: string
      total_tasks:
        type: integer
    type: object
  go-gin-crud_internal_dto.BatchTransactionRequest:
    properties:
      operations:
        description: '-1: 取款, 0: 查詢, 1+: 存款'
        items:
          type: integer
        type: array
    required:
    - operations
    type: object
  go-gin-crud_internal_dto.BatchTransactionResponse:
    properties:
      final_balance:
        type: integer
      initial_balance:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/go-gin-crud_internal_dto.TransactionResponse'
        type: array
    type: object
  go-gin-crud_internal_dto.BookResponse:
    properties:
      author:
        type: string
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  go-gin-crud_internal_dto.ChangePasswordRequest:
    properties:
      current_password:
        minLength: 6
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  go-gin-crud_internal_dto.CounterDecrementRequest:
    properties:
      amount:
        minimum: 1
        type: integer
    required:
    - amount
    type: object
  go-gin-crud_internal_dto.CounterIncrementRequest:
    properties:
      amount:
        minimum: 1
        type: integer
    required:
    - amount
    type: object
  go-gin-crud_internal_dto.CounterResponse:
    properties:
      value:
        type: integer
    type: object
  go-gin-crud_internal_dto.CounterServiceInfo:
    properties:
      description:
        type: string
      type:
        type: string
    type: object
  go-gin-crud_internal_dto.CounterSetRequest:
    properties:
      value:
        type: integer
    required:
    - value
    type: object
  go-gin-crud_internal_dto.CreateBookRequest:
    properties:
      author:
        maxLength: 255
        minLength: 1
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - author
    - title
    type: object
  go-gin-crud_internal_dto.CreatePostRequest:
    properties:
      content:
        minLength: 1
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  go-gin-crud_internal_dto.CreateProductRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
    required:
    - name
    - price
    type: object
  go-gin-crud_internal_dto.CreateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
      role:
        enum:
        - user
        - admin
        type: string
    required:
    - email
    - password
    type: object
  go-gin-crud_internal_dto.CreateWorkerPoolRequest:
    properties:
      pool_id:
        description: 工作池 ID
        type: string
      queue_size:
        description: 任務佇列大小（可選，預設無限制）
        minimum: 1
        type: integer
      worker_count:
        description: Worker 數量
        maximum: 100
        minimum: 1
        type: integer
    required:
    - pool_id
    - worker_count
    type: object
  go-gin-crud_internal_dto.DepositRequest:
    properties:
      amount:
        minimum: 1
        type: integer
    required:
    - amount
    type: object
  go-gin-crud_internal_dto.ExecuteTaskRequest:
    properties:
      max_retry:
        description: 最大重試次數
        type: integer
      retry_delay:
        description: 重試延遲（毫秒）
        type: integer
      task:
        $ref: '#/definitions/go-gin-crud_internal_dto.TaskRequest'
      timeout:
        description: 超時時間（秒）
        minimum: 1
        type: integer
    required:
    - task
    - timeout
    type: object
  go-gin-crud_internal_dto.ExecuteTaskResponse:
    properties:
      completed_at:
        type: string
      duration:
        description: 執行時間（毫秒）
        type: integer
      message:
        type: string
      retry_count:
        type: integer
      status:
        type: string
      task_id:
        type: string
    type: object
  go-gin-crud_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  go-gin-crud_internal_dto.PaginationResponse:
    properties:
      data: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  go-gin-crud_internal_dto.PostResponse:
    properties:
      author:
        $ref: '#/definitions/go-gin-crud_internal_dto.UserResponse'
      author_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  go-gin-crud_internal_dto.ProductResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  go-gin-crud_internal_dto.RateLimiterConfig:
    properties:
      algorithm:
        description: 演算法類型：sliding_window, fixed_window
        type: string
      key:
        description: 限流鍵（如：IP、用戶ID等）
        type: string
      limit:
        description: 限制數量
        type: integer
      window:
        description: 時間窗口（如：1s, 1m）
        type: string
    type: object
  go-gin-crud_internal_dto.RateLimiterStats:
    properties:
      active_keys:
        description: 活躍的限流鍵數量
        type: integer
      allowed_requests:
        description: 允許的請求數
        type: integer
      blocked_requests:
        description: 被阻止的請求數
        type: integer
      last_reset_time:
        description: 最後重置時間
        type: string
      total_requests:
        description: 總請求數
        type: integer
    type: object
  go-gin-crud_internal_dto.RateLimiterStatus:
    properties:
      algorithm:
        description: 演算法類型
        type: string
      current_count:
        description: 當前窗口內的請求數
        type: integer
      is_allowed:
        description: 是否允許請求
        type: boolean
      key:
        type: string
      limit:
        type: integer
      remaining:
        description: 剩餘可用請求數
        type: integer
      reset_time:
        description: 重置時間
        type: string
      window:
        description: 時間窗口字串表示
        type: string
    type: object
  go-gin-crud_internal_dto.RateLimiterTestRequest:
    properties:
      concurrent:
        description: 併發數（可選）
        type: integer
      key:
        description: 限流鍵
        type: string
      limit:
        description: 限制數量
        minimum: 1
        type: integer
      requests:
        description: 測試請求數量
        minimum: 1
        type: integer
      window:
        description: 時間窗口（如：1s, 1m）
        type: string
    required:
    - key
    - limit
    - requests
    - window
    type: object
  go-gin-crud_internal_dto.RateLimiterTestResponse:
    properties:
      allowed_requests:
        type: integer
      blocked_requests:
        type: integer
      details:
        description: 詳細結果
        items:
          $ref: '#/definitions/go-gin-crud_internal_dto.RateLimiterStatus'
        type: array
      duration:
        description: 測試耗時
        type: string
      success_rate:
        description: 成功率
        type: number
      total_requests:
        type: integer
    type: object
  go-gin-crud_internal_dto.SubmitTaskRequest:
    properties:
      data:
        additionalProperties: true
        description: 任務數據
        type: object
      pool_id:
        description: 工作池 ID
        type: string
      priority:
        description: 優先級（預設 0）
        type: integer
      task_id:
        description: 任務 ID
        type: string
      timeout:
        description: 超時時間（秒，預設 30 秒）
        type: integer
      type:
        description: 任務類型
        type: string
    required:
    - pool_id
    - task_id
    - type
    type: object
  go-gin-crud_internal_dto.SubmitTaskResponse:
    properties:
      message:
        type: string
      pool_id:
        type: string
      status:
        description: submitted, rejected
        type: string
      submitted_at:
        type: string
      task_id:
        type: string
    type: object
  go-gin-crud_internal_dto.TaskRequest:
    properties:
      description:
        type: string
      duration:
        description: 任務執行時間（毫秒）
        type: integer
      id:
        type: string
    required:
    - id
    type: object
  go-gin-crud_internal_dto.TaskResponse:
    properties:
      completed_at:
        type: string
      duration:
        description: 實際執行時間（毫秒）
        type: integer
      error:
        type: string
      id:
        type: string
      message:
        type: string
      status:
        description: '"success", "timeout", "cancelled", "error"'
        type: string
    type: object
  go-gin-crud_internal_dto.TransactionResponse:
    properties:
      after:
        type: integer
      amount:
        type: integer
      before:
        type: integer
      message:
        type: string
      operation:
        description: '"deposit", "withdraw", "balance"'
        type: string
      success:
        type: boolean
    type: object
  go-gin-crud_internal_dto.UpdateBookRequest:
    properties:
      author:
        maxLength: 255
        minLength: 1
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  go-gin-crud_internal_dto.UpdatePostRequest:
    properties:
      content:
        minLength: 1
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  go-gin-crud_internal_dto.UpdateProductRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        minimum: 0
        type: number
      stock:
        minimum: 0
        type: integer
    type: object
  go-gin-crud_internal_dto.UpdateUserRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
    type: object
  go-gin-crud_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      updated_at:
        type: string
    type: object
  go-gin-crud_internal_dto.WithdrawRequest:
    properties:
      amount:
        minimum: 1
        type: integer
    required:
    - amount
    type: object
  go-gin-crud_internal_dto.WorkerPoolResult:
    properties:
      completed_at:
        description: 完成時間
        type: string
      duration:
        description: 執行時間（毫秒）
        type: integer
      error:
        description: 錯誤訊息
        type: string
      result:
        additionalProperties: true
        description: 執行結果
        type: object
      status:
        description: 狀態：success, failed, timeout, cancelled
        type: string
      task_id:
        description: 任務 ID
        type: string
      worker_id:
        description: 處理該任務的 Worker ID
        type: integer
    type: object
  go-gin-crud_internal_dto.WorkerPoolStatus:
    properties:
      active_workers:
        description: 活躍的 Worker 數量
        type: integer
      completed_tasks:
        description: 已完成任務數
        type: integer
      created_at:
        description: 創建時間
        type: string
      failed_tasks:
        description: 失敗任務數
        type: integer
      is_running:
        description: 是否運行中
        type: boolean
      pool_id:
        description: 工作池 ID
        type: string
      queue_capacity:
        description: 佇列容量（-1 表示無限制）
        type: integer
      queue_size:
        description: 當前佇列大小
        type: integer
      total_tasks:
        description: 總任務數
        type: integer
      worker_count:
        description: Worker 數量
        type: integer
    type: object
  internal_controller.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 100
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: 這是一個使用 Gin 框架構建的 CRUD API 服務，包含用戶管理、書籍管理、產品管理、文章管理、認證、限流器、工作池等功能。
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go Gin CRUD API
  version: "1.0"
paths:
  /api/accounts/balance:
    get:
      description: 獲取當前帳戶餘額
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.AccountResponse'
      summary: 獲取帳戶餘額
      tags:
      - account
    post:
      description: 設置帳戶初始餘額
      parameters:
      - description: 餘額
        in: body
        name: balance
        required: true
        schema:
          properties:
            balance:
              format: int64
              type: integer
          type: object
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.AccountResponse'
      summary: 設置餘額
      tags:
      - account
  /api/accounts/batch:
    post:
      description: 並發執行多筆交易（存款、取款、查詢）
      parameters:
      - description: 交易操作列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-gin-crud_internal_dto.BatchTransactionRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.BatchTransactionResponse'
      summary: 批量執行交易
      tags:
      - account
  /api/accounts/batch/random:
    post:
      description: 生成隨機交易操作並執行（用於演示併發）
      parameters:
      - default: 10
        description: 交易數量
        in: query
        name: count
        type: integer
      - default: false
        description: 是否添加延遲（用於演示）
        in: query
        name: delay
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.BatchTransactionResponse'
      summary: 執行隨機批量交易
      tags:
      - account
  /api/accounts/deposit:
    post:
      description: 向帳戶存款
      parameters:
      - description: 存款金額
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-gin-crud_internal_dto.DepositRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.TransactionResponse'
      summary: 存款
      tags:
      - account
  /api/accounts/reset:
    post:
      description: 重置帳戶餘額為 0
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.AccountResponse'
      summary: 重置帳戶
      tags:
      - account
  /api/accounts/withdraw:
    post:
      description: 從帳戶取款
      parameters:
      - description: 取款金額
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-gin-crud_internal_dto.WithdrawRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.TransactionResponse'
      summary: 取款
      tags:
      - account
  /api/counter:
    get:
      description: 獲取指定類型計數器的當前值
      parameters:
      - default: mutex
        description: 計數器類型 (mutex/atomic)
        in: query
        name: type
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.CounterResponse'
      summary: 獲取計數值
      tags:
      - counter
  /api/counter/decrement:
    post:
      description: 減少指定類型計數器的值
      parameters:
      - default: mutex
        description: 計數器類型 (mutex/atomic)
        in: query
        name: type
        type: string
      - description: 減少數量
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-gin-crud_internal_dto.CounterDecrementRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.CounterResponse'
      summary: 減少計數
      tags:
      - counter
  /api/counter/increment:
    post:
      description: 增加指定類型計數器的值
      parameters:
      - default: mutex
        description: 計數器類型 (mutex/atomic)
        in: query
        name: type
        type: string
      - description: 增加數量
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-gin-crud_internal_dto.CounterIncrementRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.CounterResponse'
      summary: 增加計數
      tags:
      - counter
  /api/counter/info:
    get:
      description: 獲取計數器服務的類型和描述
      parameters:
      - default: mutex
        description: 計數器類型 (mutex/atomic)
        in: query
        name: type
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.CounterServiceInfo'
      summary: 獲取計數器服務資訊
      tags:
      - counter
  /api/counter/performance:
    get:
      description: 比較 Mutex 和 Atomic 實現的性能
      parameters:
      - default: 1000
        description: 迭代次數
        in: query
        name: iterations
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 性能比較
      tags:
      - counter
  /api/counter/reset:
    post:
      description: 重置指定類型計數器的值為 0
      parameters:
      - default: mutex
        description: 計數器類型 (mutex/atomic)
        in: query
        name: type
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.CounterResponse'
      summary: 重置計數器
      tags:
      - counter
  /api/counter/set:
    post:
      description: 設置指定類型計數器的值
      parameters:
      - default: mutex
        description: 計數器類型 (mutex/atomic)
        in: query
        name: type
        type: string
      - description: 計數值
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-gin-crud_internal_dto.CounterSetRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.CounterResponse'
      summary: 設置計數值
      tags:
      - counter
  /api/rate-limiter/config:
    post:
      description: 為指定 key 設置限流器配置
      parameters:
      - description: 限流器配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-gin-crud_internal_dto.RateLimiterConfig'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-gin-crud_internal_dto.RateLimiterStatus'
      summary: 設置限流器配置
      tags:
      - rate-limiter
  /api/rate-limiter/reset:
    post:
      description: 重置指定 key 的限流器
      parameters:
      - description: 限流鍵
        in: query
        name: key
        required: true
        type: string

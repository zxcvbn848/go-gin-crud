services:
  mysql:
    image: mysql:8.0
    container_name: go_gin_crud_mysql
    ports:
      - "${DB_PORT:-3307}:3306"   # MySQL (host port from env or 3307 -> container 3306)
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-a3935522}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-goGinCRUD}
      MYSQL_USER: ${MYSQL_USER:-gogin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-a3935522}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - go-gin-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-a3935522}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: go_gin_crud_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - go-gin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_gin_crud_app
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_ADDR: redis:${REDIS_PORT:-6379}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - go-gin-network

volumes:
  mysql_data:
  redis_data:

networks:
  go-gin-network:
    driver: bridge


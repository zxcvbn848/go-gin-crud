name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: 運行測試
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependencies: true

    - name: 運行測試
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_NAME: test_db
        ACCESS_SECRET: test_access_secret_key_for_testing_only
        REFRESH_SECRET: test_refresh_secret_key_for_testing_only
      run: |
        go test -v -race -coverprofile=coverage.out ./tests/...
        go tool cover -html=coverage.out -o coverage.html

    - name: 上傳測試覆蓋率
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  build:
    name: 構建應用
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependencies: true

    - name: 構建應用
      run: |
        go build -o main ./cmd/main.go
        chmod +x main

    - name: 上傳構建產物
      uses: actions/upload-artifact@v3
      with:
        name: go-gin-crud
        path: main
        retention-days: 7

  lint:
    name: 代碼檢查
    runs-on: ubuntu-latest
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: 運行 golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m


name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: 運行測試
    runs-on: ubuntu-latest
    # 測試曾因並發邏輯 bug 卡死，燒掉整個 runner 額度；寧可 10 分鐘紅燈
    timeout-minutes: 10

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    # 測試使用 SQLite in-memory（tests/api_test.go），不需要 MySQL / Redis service
    - name: 運行測試
      env:
        ACCESS_SECRET: test_access_secret_key_for_testing_only
        REFRESH_SECRET: test_refresh_secret_key_for_testing_only
      run: go test -v -race -timeout 5m -coverprofile=coverage.out ./tests/...

  build:
    name: 構建應用
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: 構建應用
      run: |
        go build -o main ./cmd/main.go
        chmod +x main

    - name: 上傳構建產物
      uses: actions/upload-artifact@v4
      with:
        name: go-gin-crud
        path: main
        retention-days: 7

  lint:
    name: 代碼檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: 運行 golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.12.2

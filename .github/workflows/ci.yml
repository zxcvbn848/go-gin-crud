name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: 運行測試
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
        cache: true

    - name: 運行測試
      env:
        ACCESS_SECRET: test_access_secret_key_for_testing_only
        REFRESH_SECRET: test_refresh_secret_key_for_testing_only
        GOFLAGS: -count=1  # 禁用測試緩存，確保每次都是全新運行
      run: |
        # 設置測試超時並運行測試
        go test -v -timeout=3m -race -coverprofile=coverage.out ./tests/...
        go tool cover -html=coverage.out -o coverage.html

    - name: 上傳測試覆蓋率
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  build:
    name: 構建應用
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
        cache: true

    - name: 構建應用
      run: |
        go build -o main ./cmd/main.go
        chmod +x main

    - name: 上傳構建產物
      uses: actions/upload-artifact@v3
      with:
        name: go-gin-crud
        path: main
        retention-days: 7

  lint:
    name: 代碼檢查
    runs-on: ubuntu-latest
    
    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Go 環境
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
        cache: true

    - name: 安裝 golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: 運行 golangci-lint
      run: |
        golangci-lint run --timeout=5m


name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署環境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 構建並推送 Docker 映像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 設置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登錄到 Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 提取元數據（標籤、標籤）
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 構建並推送 Docker 映像
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: 部署到服務器
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ secrets.DEPLOY_URL }}

    steps:
    - name: 檢出代碼
      uses: actions/checkout@v4

    - name: 部署到服務器（SSH）
      uses: appleboy/ssh-action@v1.0.0
      if: ${{ secrets.DEPLOY_HOST != '' }}
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        script: |
          # 拉取最新映像
          echo "${{ secrets.DEPLOY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # 停止舊容器
          docker stop go-gin-crud-app || true
          docker rm go-gin-crud-app || true
          
          # 啟動新容器
          docker run -d \
            --name go-gin-crud-app \
            --restart unless-stopped \
            -p 8080:8080 \
            --env-file /path/to/.env \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # 清理舊映像
          docker image prune -f

    - name: 健康檢查
      run: |
        sleep 10
        curl -f ${{ secrets.DEPLOY_URL }}/health || exit 1

    - name: 發送通知
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          部署狀態: ${{ job.status }}
          環境: ${{ github.event.inputs.environment || 'production' }}
          分支: ${{ github.ref }}
          提交: ${{ github.sha }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


